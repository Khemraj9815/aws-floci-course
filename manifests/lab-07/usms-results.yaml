apiVersion: apps/v1
kind: Deployment
metadata:
  name: usms-results
  namespace: usms
  labels:
    app: usms-results
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usms-results
  template:
    metadata:
      labels:
        app: usms-results
    spec:
      containers:
      - name: results
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: usms-results
  namespace: usms
  labels:
    app: usms-results
spec:
  selector:
    app: usms-results
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
